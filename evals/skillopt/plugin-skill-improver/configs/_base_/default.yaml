seed: 42

model:
  reasoning_effort: medium

train:
  num_epochs: 1
  train_size: 4
  batch_size: 4
  accumulation: 1
  max_steps: 1
  steps_per_epoch: 1

gradient:
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  backend: codex_chat
  target_backend: codex_exec
  learning_rate: 4
  slow_update_gate_with_selection: true

evaluation:
  sel_env_num: 2
  test_env_num: 2

env:
  split_mode: split_dir
  data_path: ""
  split_output_dir: ""
  max_turns: 1
  max_completion_tokens: 12000
  workers: 1

_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  train_size: 20
  batch_size: 4
  accumulation: 1

gradient:
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  learning_rate: 4
  slow_update_gate_with_selection: true

evaluation:
  sel_env_num: 2
  test_env_num: 2

env:
  name: agent_instructions_improver
  skill_init: skillopt/envs/agent_instructions_improver/skills/initial.md
  split_mode: split_dir
  split_dir: .skillopt/data/agent-instructions-improver-v1
  data_path: ""
  split_output_dir: ""
  max_turns: 1
  max_completion_tokens: 12000
  workers: 1
  limit: 20
